name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) != tag version (${{ steps.ver.outputs.version }})"
            exit 1
          fi

      - name: Extract CHANGELOG section
        id: notes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const start = text.indexOf(`## [${version}]`);
          if (start === -1) {
            console.error(`No CHANGELOG section for ${version}`);
            process.exit(1);
          }
          const after = text.slice(start);
          const next = after.search(/\n## \[/);
          const section = (next === -1 ? after : after.slice(0, next)).trim() + '\n';
          fs.writeFileSync('release-notes.md', section);
          NODE
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Service Certify ${{ steps.ver.outputs.tag }}" \
            --notes-file release-notes.md \
            --verify-tag
