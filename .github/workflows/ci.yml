name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Guard private question bank
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src/convex/seed/devQuestionBank.private.ts >/dev/null 2>&1; then
            echo "src/convex/seed/devQuestionBank.private.ts must not be tracked"
            exit 1
          fi
          loader_bytes=$(wc -c < src/convex/seed/devQuestionBank.ts)
          if [ "$loader_bytes" -gt 20000 ]; then
            echo "Tracked loader src/convex/seed/devQuestionBank.ts is ${loader_bytes} bytes; the full bank may have leaked into git"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
